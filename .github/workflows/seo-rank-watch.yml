name: SEO Rank Watch — daily cycle

on:
  schedule:
    # 06:00 UTC daily = 07:00 Africa/Lagos. Adjust to taste.
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger a run manually from the Actions tab while testing

permissions:
  contents: write # the agent commits data-file updates and pushes edit branches
  pull-requests: write # the agent opens PRs for post edits / noindex / structural changes
  id-token: write

jobs:
  run-cycle:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      SEO_MIN_IMPRESSIONS: '10'
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # lets the agent's `gh pr create` calls authenticate
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, so the agent can diff/snapshot cleanly

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run the seo-rank-watch cycle
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Run the seo-rank-watch skill now. Follow .claude/skills/seo-rank-watch/SKILL.md exactly,
            start to finish, for one full cycle. End with the cycle report described in that file.
          claude_args: '--allowedTools "Bash,Read,Write,Edit,Glob,Grep" --model claude-sonnet-5-5'

      # Deterministic safety net: whatever the agent decided, any change it left
      # under data/seo/ (the daily measurement, review results) lands on main.
      # Without this, a cycle that ends in "nothing qualifies, stop" appended its
      # measurement inside this throwaway runner and lost it (27-30 Sept 2026).
      # always(): appended measurements are valid even if the agent step failed
      # later in the cycle. Post edits still go through the agent's PRs.
      - name: Persist SEO data logs to main
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The agent may have left the checkout on a PR branch, with the day's
          # data committed there (e.g. via `git commit -a`) or left uncommitted.
          # Snapshot data/seo exactly as it stands, move to main, lay it back.
          # Safe because rank-history.json is append-only: the snapshot always
          # contains everything main had at checkout, plus this cycle's entries.
          snap="$(mktemp -d)"
          cp -R data/seo "$snap/"
          git checkout -f main
          cp -R "$snap/seo/." data/seo/
          git add data/seo
          git diff --cached --quiet || git commit -m "chore(seo): log rank-watch cycle $(date -u +%F)"

          # Covers both the commit above and any data commit the agent made on
          # main without pushing it.
          git fetch origin main
          if [ -z "$(git rev-list origin/main..main)" ]; then
            echo "No data/seo changes to persist."
            exit 0
          fi
          # Only ever auto-push logs. Page/post edits must go through a PR, so
          # refuse (and fail the job visibly) if anything else is queued.
          others="$(git diff --name-only origin/main..main | grep -v '^data/seo/' || true)"
          if [ -n "$others" ]; then
            echo "::error::Unpushed commits on main touch files outside data/seo/ — not pushing:"
            echo "$others"
            exit 1
          fi
          git pull --rebase origin main
          git push origin main
